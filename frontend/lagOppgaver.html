<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lag Oppgaver</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    <div class="icon-bar">
        <a href="profilSide.html"><i class="fa fa-user"></i></a> 
        <a href="lagOppgaver.html" class="active"><i class="fa fa-plus-square"></i></a> 
        <a href="gjortOppgave.html"><i class="fa fa-check-square"></i></a> 
        <a href="oversikt.html"><i class="fa fa-group"></i></a>
    </div>

    <div class="oppgaveliste">
        <h1>Lag Oppgaver</h1>
        <p>Her kan du legge til nye oppgaver:</p>
        
        <form id="oppgaveForm">
            <label for="oppgave">Oppgave:</label>
            <input type="text" id="oppgave" name="oppgave" placeholder="F.eks. Støvsuge stua" required>

            <label for="poeng">Poeng (1-5):</label>
            <input type="number" id="poeng" name="poeng" placeholder="Opptil 5" min="1" max="5" required>

            <label for="beskrivelse">Beskrivelse:</label>
            <textarea id="beskrivelse" name="beskrivelse" placeholder="Husk under sofaen..." required></textarea>
            
            <button type="submit">Legg til oppgave</button>
        </form>
    </div>

<script>
    document.getElementById('oppgaveForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const data = {
            tittel: document.getElementById('oppgave').value,
            poeng: Number(document.getElementById('poeng').value),
            beskrivelse: document.getElementById('beskrivelse').value
        };

        const response = await fetch('http://localhost:3000/api/oppgaver', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert('Oppgaven er lagret i databasen!');
            this.reset();
        }
    });
</script>

</body>
</html>
