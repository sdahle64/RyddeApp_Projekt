<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Din profil Ryddeapp</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    <div class="icon-bar">
        <a href="profilSide.html" class="active"><i class="fa fa-user"></i></a> 
        <a href="lagOppgaver.html"><i class="fa fa-plus-square"></i></a> 
        <a href="gjortOppgave.html"><i class="fa fa-check-square"></i></a> 
        <a href="oversikt.html"><i class="fa fa-group"></i></a>
    </div>

 <div class="login-container">
        <h1 id="profilTittel">Din profil 🦋</h1>
        <p>Totalt opptjent: <strong id="mineTotalePoeng">0 p</strong></p>

        <h3>Dine fullførte oppgaver:</h3>
        <table>
            <thead>
                <tr>
                    <th>Oppgave</th>
                    <th>Poeng</th>
                    <th>Dato</th>
                </tr>
            </thead>
            <tbody id="mineOppgaverListe">
                <!-- Fylles automatisk av script.js -->
            </tbody>
        </table>

        <button onclick="loggUt()" class="logout-btn">Logg ut</button>
    </div>

    <script src="script.js"></script>    
</body>
</html>
